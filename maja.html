html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.brand{font-size:12.5px;font-weight:800;letter-spacing:.08em;color:var(--brand);text-transform:uppercase}
h1{margin:4px 0 2px;font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1.1;overflow-wrap:anywhere}
.sub{margin:0;color:var(--ink-3);font-weight:700;font-size:14px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:18px 0 14px}
.mon{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}

.mon b::first-letter{text-transform:uppercase}
button,select{font:inherit;color:inherit}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;cursor:pointer}

.pr{height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 18px;font-weight:800;cursor:pointer;margin-left:auto}
.sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:0 0 18px}
.sc{border-radius:20px;padding:14px 16px;color:#17201c}

.sc b{display:block;font-size:14px;font-weight:800}.sc .n{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:6px;line-height:1.1}.sc small{font-size:12.5px;font-weight:700;opacity:.75}
.c-aizv{background:var(--mint)}.c-izv{background:var(--sand)}.c-kais{background:var(--sky)}.c-pl{background:var(--lime)}.c-logi{background:var(--aqua)}.c-sniegs{background:var(--frost)}.c-darz{background:var(--olive)}.c-stav{background:var(--peach)}
.day{margin:0 0 14px}
.day h2{margin:0 0 8px;font-size:14px;font-weight:800;color:var(--ink-3)}
.day h2::first-letter{text-transform:uppercase}
.it{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:0 0 8px;display:flex;flex-direction:column;gap:6px}
.it .t{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.it .a{font-weight:800;font-size:15.5px;flex:1 1 200px;min-width:0;overflow-wrap:anywhere}
.ch{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;color:#17201c}

.q{font-weight:800;font-size:13.5px;color:var(--ink-2)}
.p{margin:0;font-size:13.5px;font-weight:600;color:var(--ink-2);overflow-wrap:anywhere}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 0}

.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button:focus-visible,.lang button:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.lang{display:flex;gap:4px;flex:none}
.lang button{min-width:44px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:12.5px;cursor:pointer}
.lang button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.form{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px;max-width:640px}
.form label{display:grid;gap:6px;font-weight:800;font-size:14px}
.form small{font-weight:600;color:var(--ink-3)}
input,textarea{font:inherit;color:inherit}
.form input,.form textarea,.form select{width:100%;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);padding:10px 14px;font-size:16px;font-weight:600;min-height:44px;flex:none}
.form select{border-radius:14px}
.form textarea{min-height:110px;resize:vertical}
.btn{height:48px;border-radius:999px;border:0;background:var(--brand);color:#fff;font-weight:800;font-size:15.5px;padding:0 22px;cursor:pointer}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.ok{background:var(--mint);border-radius:18px;padding:16px;font-weight:800}
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.tbl th,.tbl td{padding:10px 12px;text-align:left;font-size:14px;border-bottom:1px solid var(--line);vertical-align:top}

.tbl td.n{text-align:right;white-space:nowrap;font-weight:800}
.st{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--surface-2)}
.st.paid{background:var(--lime)}.st.late{background:#fde4e1;color:#8a1c12}

@media (max-width:560px){.tbl.inv thead{display:none}.tbl.inv tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border-bottom:1px solid var(--line)}.tbl.inv td{border:0;padding:2px 0}.tbl.inv td.n{text-align:right}}
.note{background:var(--sand);border-radius:16px;padding:12px 14px;font-weight:700;font-size:14px;margin:0 0 10px}
h2.sec{margin:18px 0 10px;font-size:18px;font-weight:800;letter-spacing:-.01em}
.copy{margin:22px 0 0;text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-3)}
@media print{.bar .ib,.pr,select,.lb,.tabs,.lang{display:none!important}body{background:#fff}.it,.sc{break-inside:avoid}.mon{border:0}}
</style>
