<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<title>Atzīmēt nopļautu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#17201c}a:hover{color:#4a534f}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f1f4f2; color: #17201c; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; overflow: hidden; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="Main.dc.html" aria-label="Atpakaļ" style="width: 44px; height: 44px; border-radius: 50%; background: #fff; display: grid; place-items: center; text-decoration: none; flex: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17201c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <span style="font-size: 13px; font-weight: 800; color: #6d7672">5. adrese no 7</span>
    </div>

    <div style="padding: 18px 18px 16px; border-radius: 28px; background: #d6e8e1">
      <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #4a534f">Pļaušana · ik 10 dienas</span>
      <h1 style="margin: 6px 0 0; font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1">Upeņu iela 15, 17</h1>
      <div style="display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap">
        <span style="font-size: 12.5px; font-weight: 800; padding: 6px 12px; border-radius: 999px; background: #fff">980 m²</span>
        <span style="font-size: 12.5px; font-weight: 800; padding: 6px 12px; border-radius: 999px; background: #fff">Augstums 5 cm</span>
        <a href="Objekts.dc.html" style="font-size: 12.5px; font-weight: 800; padding: 6px 12px; border-radius: 999px; background: #17201c; color: #fff; text-decoration: none">Teritorijas plāns</a>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="height: 150px; border-radius: 22px; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 2px dashed #c9d3ce">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4a534f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <b style="font-size: 13px; font-weight: 800">Bilde pirms</b>
        <span style="font-size: 11.5px; font-weight: 700; color: #6d7672">nav obligāta</span>
      </div>
      <div style="height: 150px; border-radius: 22px; background: #17201c; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <b style="font-size: 13px; font-weight: 800">Bilde pēc pļaušanas</b>
        <span style="font-size: 11.5px; font-weight: 700; color: #c9d3ce">obligāta · GPS + laiks</span>
      </div>
    </div>

    <div style="padding: 6px; border-radius: 24px; background: #fff; display: flex; flex-direction: column">
      <sc-for list="{{checks}}" as="c" hint-placeholder-count="3">
        <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; font-size: 14.5px; font-weight: 700">
          <input type="checkbox" checked="{{c.on}}" style="width: 22px; height: 22px; accent-color: #17201c; margin: 0">
          <span>{{c.t}}</span>
        </label>
      </sc-for>
    </div>

    <label style="display: block">
      <span style="display: block; font-size: 13px; font-weight: 800; color: #4a534f; margin: 0 0 6px 4px">Piezīme vadītājam</span>
      <input type="text" placeholder="Piem. pie bērnu laukuma bedre" style="width: 100%; box-sizing: border-box; height: 48px; border: 0; border-radius: 16px; background: #fff; padding: 0 16px; font: 700 15px Manrope, sans-serif; color: #17201c">
    </label>

    <div>
      <span style="display: block; font-size: 13px; font-weight: 800; color: #4a534f; margin: 0 0 6px 4px">Nevar izpildīt? Adrese pārcelsies pati</span>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <sc-for list="{{reasons}}" as="r" hint-placeholder-count="5">
          <button type="button" style="min-height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: #fff; font: 800 13px Manrope, sans-serif; color: #17201c">{{r}}</button>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="flex: none; padding: 12px 16px 16px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 8px">
    <a href="Main.dc.html" style="min-height: 56px; border-radius: 999px; background: #f5dbe3; color: #17201c; display: grid; place-items: center; font-size: 15px; font-weight: 800; text-decoration: none">Nevar</a>
    <a href="Main.dc.html" style="min-height: 56px; border-radius: 999px; background: #17201c; color: #fff; display: grid; place-items: center; font-size: 16px; font-weight: 800; text-decoration: none">Nopļauts</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      checks: [{ t: 'Zāliens nopļauts', on: true }, { t: 'Malas apgrieztas', on: true }, { t: 'Zāle savākta / aizvesta', on: false }],
      reasons: ['Lietus', 'Slapjš zāliens', 'Nav piekļuves', 'Tehnika', 'Nepaspēju']
    };
  }
}
</script>
</body>
</html>
