<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<title>Grafika noteikumi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#17201c}a:hover{color:#4a534f}
</style>
</helmet>
<div style="box-sizing: border-box; min-height: 880px; background: #f1f4f2; color: #17201c; font-family: Manrope, system-ui, sans-serif; padding: 32px clamp(16px, 3vw, 40px)">
  <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px">
      <div style="flex: 1 1 320px">
        <div style="font-size: 13px; font-weight: 700; color: #6d7672">Zāles pļaušana · Administrēšana</div>
        <h1 style="margin: 2px 0 0; font-size: clamp(30px, 4vw, 46px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05">Kā grafiks veidojas pats</h1>
      </div>
      <a href="Menesis.dc.html" style="min-height: 56px; padding: 0 24px; border-radius: 999px; background: #17201c; color: #fff; display: inline-flex; align-items: center; font-size: 15px; font-weight: 800; text-decoration: none">Saglabāt</a>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
      <sc-for list="{{rules}}" as="r" hint-placeholder-count="6">
        <section style="padding: 20px; border-radius: 28px; background: {{r.bg}}; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; align-items: center; gap: 12px">
            <span style="width: 44px; height: 44px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex: none; font-size: 15px; font-weight: 800">{{r.k}}</span>
            <h2 style="margin: 0; flex: 1; font-size: 19px; font-weight: 800; letter-spacing: -0.02em">{{r.t}}</h2>
            <label style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800">
              <input type="checkbox" checked="{{r.on}}" style="width: 22px; height: 22px; accent-color: #17201c; margin: 0"><span>Ieslēgts</span>
            </label>
          </div>
          <p style="margin: 0; font-size: 14px; font-weight: 700; color: #4a534f; line-height: 1.45">{{r.d}}</p>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{r.vals}}" as="v" hint-placeholder-count="2">
              <label style="display: flex; flex-direction: column; gap: 4px; flex: 1 1 130px">
                <span style="font-size: 12px; font-weight: 800; color: #4a534f">{{v.l}}</span>
                <input type="text" value="{{v.v}}" style="height: 44px; border: 0; border-radius: 14px; background: #fff; padding: 0 14px; font: 800 15px Manrope, sans-serif; color: #17201c; box-sizing: border-box; width: 100%">
              </label>
            </sc-for>
          </div>
        </section>
      </sc-for>
    </div>

    <div style="padding: 20px; border-radius: 28px; background: #fff">
      <h2 style="margin: 0 0 12px; font-size: 19px; font-weight: 800; letter-spacing: -0.02em">Secība, kādā grafiks lemj katru rītu 06:00</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
          <div style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 18px; background: #f3f5f4">
            <b style="width: 28px; height: 28px; border-radius: 50%; background: #17201c; color: #fff; display: grid; place-items: center; flex: none; font-size: 13px">{{s.n}}</b>
            <span style="font-size: 13.5px; font-weight: 700; line-height: 1.4">{{s.t}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":880}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rules: [
        { k: '1', t: 'Lietus', bg: '#d8e6f2', on: true, d: 'Ja prognozē lietu darba laikā, adreses pārceļas uz nākamo sauso darba dienu. Pēc lietus zāliens tiek uzskatīts par slapju.',
          vals: [{ l: 'Pārcelt, ja lietus ≥', v: '3 mm' }, { l: 'Slapjš pēc lietus', v: '24 h' }] },
        { k: '2', t: 'Nepaspētās adreses', bg: '#f4e4b4', on: true, d: 'Ko izpildītājs atzīmē «Nevar» vai līdz dienas beigām nav nopļāvis, nākamajā darba dienā ir pirmās maršrutā.',
          vals: [{ l: 'Pārcelt uz', v: 'nākamo darba dienu' }, { l: 'Paziņot vadītājam pēc', v: '2 pārcelšanām' }] },
        { k: '3', t: 'Intervāls', bg: '#d6e8e1', on: true, d: 'Katram objektam savs intervāls; nākamo datumu rēķina no pēdējās īstās pļaušanas, ne no plāna.',
          vals: [{ l: 'Pēc noklusējuma', v: 'ik 10 dienas' }, { l: 'Sezona', v: '15.04.–15.10.' }] },
        { k: '4', t: 'Brigādes slodze', bg: '#fff', on: true, d: 'Dienā neplāno vairāk, nekā brigāde var nopļaut; pārējais aiziet uz tuvāko dienu ar brīvu vietu.',
          vals: [{ l: 'Maks. dienā', v: '6 000 m²' }, { l: 'Darba dienas', v: 'P–Pk (+S, ja kavējas)' }] },
        { k: '5', t: 'Maršruts', bg: '#fff', on: true, d: 'Dienas adreses sakārto tuvākajā secībā no bāzes, grupējot pēc grupas (Jūrmala, VNĪ).',
          vals: [{ l: 'Sākuma punkts', v: '[BĀZES ADRESE]' }, { l: 'Grupēt pēc', v: 'objektu grupas' }] },
        { k: '6', t: 'Bilde un pārbaude', bg: '#e2ddf2', on: true, d: 'Bez bildes pēc pļaušanas adresi nevar atzīmēt kā nopļautu. Vadītājs redz bildes kartiņā un var atgriezt.',
          vals: [{ l: 'Bilde pēc', v: 'obligāta' }, { l: 'Bilde pirms', v: 'nav obligāta' }] }
      ],
      steps: [
        { n: '1', t: 'Paņem objektus, kam pienācis intervāls' },
        { n: '2', t: 'Pieliek vakar nepaspētos — tie pirmie' },
        { n: '3', t: 'Izņem dienas, kad prognozē lietu' },
        { n: '4', t: 'Sadala pa brigādēm līdz slodzes limitam' },
        { n: '5', t: 'Sakārto maršrutu un nosūta izpildītājiem' }
      ]
    };
  }
}
</script>
</body>
</html>
