.sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:0 0 18px}
.sc{border-radius:20px;padding:14px 16px;color:#17201c}

.sc b{display:block;font-size:14px;font-weight:800}.sc .n{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:6px;line-height:1.1}.sc small{font-size:12.5px;font-weight:700;opacity:.75}

.day h2::first-letter{text-transform:uppercase}
.it{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:0 0 8px;display:flex;flex-direction:column;gap:6px}
.it .t{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.it .a{font-weight:800;font-size:15.5px;flex:1 1 200px;min-width:0;overflow-wrap:anywhere}
.ch{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;color:#17201c}

.q{font-weight:800;font-size:13.5px;color:var(--ink-2)}

.ph{display:flex;gap:6px;flex-wrap:wrap}
.th{width:76px;height:76px;border-radius:12px;border:0;padding:0;overflow:hidden;background:var(--surface-2);cursor:zoom-in}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.empty,.err{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center;font-weight:700;color:var(--ink-3)}
.err{color:var(--red)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 14px}

.lang{display:flex;gap:4px;flex:none}
.lang button{min-width:44px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:12.5px;cursor:pointer}
.lang button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.form{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px;max-width:640px}
.form label{display:grid;gap:6px;font-weight:800;font-size:14px}
.form small{font-weight:600;color:var(--ink-3)}

.form input,.form textarea,.form select{width:100%;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);padding:10px 14px;font-size:16px;font-weight:600;min-height:44px;flex:none}

.form textarea{min-height:110px;resize:vertical}

.ok{background:var(--mint);border-radius:18px;padding:16px;font-weight:800}
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.tbl th,.tbl td{padding:10px 12px;text-align:left;font-size:14px;border-bottom:1px solid var(--line);vertical-align:top}
